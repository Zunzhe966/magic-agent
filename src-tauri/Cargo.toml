[package]
name = "magic-agent"
version = "0.2.2"
description = "尊者魔法代理"
edition = "2021"

[lib]
name = "magic_agent_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-updater = "2"
tauri-plugin-dialog = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"

[[bin]]
name = "magic-agent"
path = "src/main.rs"

[[bin]]
name = "magic_probe"
path = "src/bin/magic_probe.rs"
